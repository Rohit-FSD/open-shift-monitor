stages:
  - build
  - push
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/css-service
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Build Docker Image
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER 
                   -p $CI_REGISTRY_PASSWORD 
                   $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker build -t $IMAGE_NAME:sit .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:sit
  only:
    - develop

# Deploy to SIT on OpenShift
deploy-sit:
  stage: deploy
  image: openshift/origin-cli:latest
  script:
    - oc login $OC_SERVER 
               --token=$OC_TOKEN 
               --insecure-skip-tls-verify
    - oc project $OC_PROJECT
    - oc apply -f openshift/
    - oc set image deployment/css-service 
               css-service=$IMAGE_NAME:$IMAGE_TAG
    - oc rollout status deployment/css-service
  only:
    - develop
