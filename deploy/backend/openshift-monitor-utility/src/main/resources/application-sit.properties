# Server
server.port=8080
spring.profiles.active=sit

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.root=INFO
logging.level.org.openshift=DEBUG

# OpenShift Connection (set these as OpenShift secrets/env vars)
openshift.cluster.url=${OC_CLUSTER_URL}
openshift.token=${OC_TOKEN}


# Backend
backend/**/target/
*.jar
*.war
*.class

# Frontend
frontend/node_modules/
frontend/dist/

# IDE
.idea/
*.iml
.vscode/

# Env
.env
*.env
application-local.properties

# OS
.DS_Store
Thumbs.db